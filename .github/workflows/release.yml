name: Release CLI binaries

# Se dispara al publicar un tag como v1.0.0
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            commands: |
              bun build --compile dist/index.mjs --target bun-linux-x64 --outfile dist-bin/lexema-linux-x64
              bun build --compile dist/index.mjs --target bun-windows-x64 --outfile dist-bin/lexema-win-x64.exe
          - os: macos-latest
            commands: |
              bun build --compile dist/index.mjs --target bun-darwin-x64 --outfile dist-bin/lexema-macos-x64
              bun build --compile dist/index.mjs --target bun-darwin-arm64 --outfile dist-bin/lexema-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: npm install

      - name: Compilar bundle (esbuild)
        run: npm run build

      - name: Inyectar token compartido por defecto
        env:
          LEXEMA_CLIENT_TOKEN: ${{ secrets.LEXEMA_CLIENT_TOKEN }}
        run: node ../scripts/inject-token.js

      - name: Generar binarios (bun compile)
        run: ${{ matrix.commands }}

      # En macOS se firma ad-hoc sobre un runner real; esto evita que el
      # sistema mate el binario al abrirlo (Gatekeeper).
      - name: Firmar binarios de macOS (ad-hoc)
        if: matrix.os == 'macos-latest'
        run: |
          for f in dist-bin/*; do
            codesign --sign - "$f" || true
          done

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: cli/dist-bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
