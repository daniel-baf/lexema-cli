name = "lexema-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Secretos (no van aquí, se configuran con `wrangler secret put`):
#   GEMINI_API_KEY -> tu clave de https://aistudio.google.com/apikey
#   CLIENT_TOKEN   -> token compartido que tu CLI enviará como Authorization: Bearer <token>
#                     (protege el endpoint de abuso; opcional pero muy recomendado)

# Rate limiting opcional por IP. Para activarlo:
#   1) wrangler kv namespace create RATE_LIMIT_KV
#   2) descomenta el bloque de abajo y pega el "id" que te devuelve el comando
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "PEGA_AQUI_EL_ID"
